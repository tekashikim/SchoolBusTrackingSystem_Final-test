{% extends "base.html" %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>{% endblock %}{% block content %}
<h1>🗺️ Live School Bus Tracking</h1><p>Driver GPS positions refresh automatically.</p><div id="map"></div>
<script>
const map=L.map('map').setView([-1.286389,36.817223],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let markers={};
function load(){fetch('/api/buses').then(r=>r.json()).then(bs=>bs.forEach(b=>{
let p=[Number(b.latitude),Number(b.longitude)]; if(!Number.isFinite(p[0]))return;
let text='<b>🚌 '+b.bus_number+'</b><br>Driver: '+(b.driver||'Not assigned')+'<br>Route: '+b.route+'<br>Status: '+b.status;
if(markers[b.id])markers[b.id].setLatLng(p).setPopupContent(text);else markers[b.id]=L.marker(p).addTo(map).bindPopup(text);
}))}load();setInterval(load,5000);
</script>{% endblock %}
